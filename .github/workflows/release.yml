name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: library-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: "off"
  GOFLAGS: -mod=readonly

jobs:
  preflight:
    name: Validate release tag and module
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Validate before running library checks
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: go run ./tools/release.go -version "$RELEASE_TAG"

  checks:
    name: Run same-tag CI
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish source release
    needs: [preflight, checks]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Create GitHub source release without creating a tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG" \
            "${prerelease[@]}"
